}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --bar:#07080a; --bar-fg:#f4f5f6; --accent:#e4e6e9; --accent-fg:#14161a;
  --ok:#7fb897; --ok-bg:#1d2a23; --warn:#d2a774; --warn-bg:#2e261c; --danger:#ff6b6b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1114; --card:#1b1e23; --fg:#f1f2f4; --muted:#9aa2ad; --line:#2f343b;
  --bar:#07080a; --bar-fg:#f4f5f6; --accent:#e4e6e9; --accent-fg:#14161a;
  --ok:#7fb897; --ok-bg:#1d2a23; --warn:#d2a774; --warn-bg:#2e261c; --danger:#ff6b6b; color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,a,input,textarea,.mini,.tile,.shoot{touch-action:manipulation}
body{margin:0;height:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden;

:focus-visible{outline:3px solid var(--muted);outline-offset:2px}

/* Barre du haut */
.bar{flex:none;background:var(--bar);color:var(--bar-fg);display:flex;align-items:center;gap:4px;min-height:58px;
  padding:calc(env(safe-area-inset-top,0px) + 6px) max(6px,env(safe-area-inset-right,0px)) 6px max(6px,env(safe-area-inset-left,0px))}

/* En-tête de marque (accueil) */
.bar.hero{min-height:0;position:relative;padding-top:calc(env(safe-area-inset-top,0px) + 18px);padding-bottom:20px;
  background:linear-gradient(160deg,#2a2e35 0%,var(--bar) 55%,#15171b 100%)}
.bar.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,#c8ccd2,#6b727c 60%,transparent)}
.bar.hero .t{display:none}
.brand{flex:1;min-width:0;display:flex;align-items:center;gap:14px;padding:0 10px}
.demo{font:700 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;padding:4px 7px;border-radius:6px;background:var(--fg);color:var(--bg);vertical-align:middle}
.brand .mark{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation;--markbg:#1f2227;flex:none;width:clamp(58px,17vw,76px);aspect-ratio:1;max-width:100%;border-radius:22%;background:#f4f5f6;color:var(--markbg);
  display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.35),inset 0 -3px 0 rgba(0,0,0,.08)}
.brand .mark svg{width:64%;height:64%}
.brand .bt{min-width:0;display:flex;flex-direction:column;gap:4px}
.brand .bn{font:700 clamp(54px,17vw,84px)/.95 var(--display);letter-spacing:.005em;color:#fff}
.brand .bs{font:600 12px/1.2 var(--body);letter-spacing:.1em;text-transform:uppercase;color:#a3aab4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .bs b{color:#e4e6e9;font-weight:700}
.bar:not(.hero) .brand{display:none}
.bar.hero .icon-btn{display:none}
.mini-mark{--markbg:#1f2227;flex:none;width:30px;height:30px;border-radius:8px;background:#f4f5f6;color:var(--markbg);display:grid;place-items:center;margin-left:4px}
.mini-mark svg{width:20px;height:20px}
.bar.hero .mini-mark,.bar.back .mini-mark{display:none}
.overview{display:flex;gap:8px;flex:none}
.overview div{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.overview b{display:block;font:700 28px/1 var(--display);font-variant-numeric:tabular-nums}
.overview span{font:600 12px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.icon-btn{width:48px;height:48px;border-radius:12px;border:0;background:transparent;color:inherit;display:grid;place-items:center;flex:none}
.icon-btn:active{background:rgba(127,127,127,.2)}
.icon-btn svg{width:26px;height:26px}

/* Zone centrale */
main{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px;width:100%;max-width:760px;margin:0 auto;
  padding:12px max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px))}
main.fit{overflow:hidden}

/* Bas d'écran */
.dock{flex:none;background:var(--bg);border-top:1px solid var(--line);
  padding:10px max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(12px,env(safe-area-inset-left,0px))}
.dock .in{max-width:760px;margin:0 auto;display:flex;gap:10px}
.primary{flex:1;border:0;border-radius:14px;min-height:60px;background:var(--accent);color:var(--accent-fg);
  font:700 22px/1.1 var(--display);letter-spacing:.03em;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 16px}
.primary:disabled{opacity:.4}

.ghost span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.ghost.sq i{display:none;position:absolute;top:9px;right:10px;width:11px;height:11px;border-radius:50%;background:var(--warn);border:2px solid var(--card)}
.ghost.sq.on{border-color:var(--warn);color:var(--warn)}
.ghost.sq.on i{display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.qchip{border:2px solid var(--line);background:var(--card);border-radius:99px;padding:9px 13px;font:600 15px var(--body);min-height:44px}
.qchip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
textarea.inp{font-family:var(--body);resize:vertical;min-height:100px;font-size:17px;line-height:1.4}
.pt .a .nt{color:var(--warn);font-weight:600}
.dock .in>*{min-width:0}
@media (max-width:400px){.dock .primary{font-size:19px;padding:0 10px;gap:6px}.dock .primary svg{width:22px;height:22px}.dock .extra{padding:0 10px;font-size:17px}.dock .ghost.sq{width:54px}}
.extra{flex:0 1 auto;gap:6px!important;min-height:60px;padding:0 14px;font:700 19px var(--display);letter-spacing:.03em;text-transform:uppercase;position:relative}
.extra b{min-width:24px;height:24px;border-radius:99px;background:var(--fg);color:var(--bg);font:700 14px/24px var(--body);padding:0 7px;text-transform:none}
.ghost{border:2px solid var(--line);background:var(--card);border-radius:14px;min-height:56px;padding:0 16px;font:600 17px var(--body);display:flex;align-items:center;justify-content:center;gap:8px}
.ghost svg{width:22px;height:22px}

/* Accueil chantier */
.stats{display:flex;gap:6px;flex-wrap:wrap;color:var(--muted);font-size:15px;flex:none}
.stats b{color:var(--fg);font-variant-numeric:tabular-nums}
.add-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:none}
.add-row .big.wide{grid-column:span 2;min-height:54px;font-size:clamp(16px,5vw,20px)}
.pt.sub{margin-left:22px;width:calc(100% - 22px);min-height:56px;padding:8px 10px;border-style:dashed;position:relative}
.pt.sub::before{content:"";position:absolute;left:-14px;top:-9px;bottom:50%;width:12px;border-left:2px solid var(--line);border-bottom:2px solid var(--line);border-bottom-left-radius:8px}
.pt.sub .ic{width:34px;height:34px}.pt.sub .ic svg{width:20px;height:20px}
.pt.sub .n{font-size:18px}
.pt.pick.on{border:2px solid var(--fg)}
.techbar{flex:none;display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 12px;min-height:52px}
.techbar svg{width:20px;height:20px;flex:none;color:var(--muted)}
.techbar .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.techbar small{font:600 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.techbar b{font:700 20px/1.1 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.techbar em{font:500 13px var(--body);font-style:normal;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.techbar .ch{font:600 14px var(--body);color:var(--muted);flex:none}
.techbar.orph{border-color:var(--danger)}.techbar.orph b{color:var(--danger)}
.fgrid{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-content:start;padding-bottom:4px}
.fgrid>button{aspect-ratio:1;max-width:100%;border-radius:12px;border:0;padding:0;overflow:hidden;background:var(--bg);position:relative;display:grid;place-items:center}
.fgrid img{width:100%;height:100%;object-fit:cover;display:block}
.fgrid .add{border:2px dashed var(--line);background:var(--card);display:flex;flex-direction:column;gap:4px;font:700 17px var(--display);text-transform:uppercase}
.fgrid .add svg{width:30px;height:30px}
.fgrid .add.first{grid-column:span 3;aspect-ratio:auto;min-height:170px;padding:16px;font-size:22px;background:var(--fg);color:var(--bg);border:0}

.fgrid .busyc::after{content:"";width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--fg);animation:spin .8s linear infinite}
.pt .a .orph{color:var(--danger);font-weight:600}
.big{min-width:0;border-radius:16px;min-height:76px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 8px;overflow:hidden;
  font:700 clamp(17px,5.6vw,23px)/1 var(--display);letter-spacing:.03em;text-transform:uppercase;background:var(--card);color:var(--fg);border:2px solid var(--line)}
.big svg{width:26px;height:26px;flex:none}
.big span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.list{display:flex;flex-direction:column;gap:8px}
main.fit .list.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:4px;
  mask-image:linear-gradient(to bottom,#000 calc(100% - 18px),transparent);-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 18px),transparent)}
main.fit .list.scroll>*{flex:none}
.pt{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left;width:100%;min-height:66px}
.pt .ic{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:var(--bg);flex:none}
.pt .ic svg{width:24px;height:24px}
.pt .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.pt .n{font:700 21px/1.1 var(--display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pt .a{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{font:600 13px/1 var(--body);padding:7px 9px;border-radius:99px;white-space:nowrap;flex:none;font-variant-numeric:tabular-nums}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.section-t{font:600 13px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);flex:none}
.empty{flex:1;border:2px dashed var(--line);border-radius:16px;padding:24px 18px;color:var(--muted);display:grid;place-items:center;text-align:center;min-height:120px}

/* Formulaires */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font:600 13px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.inp{width:100%;min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--card);padding:8px 12px;font-size:18px}
.inp:focus{border-color:var(--fg);outline:none}
.inp.bad,.inp.bad:focus{border-color:var(--danger)}
.hint{font:600 14px/1.2 var(--body);color:var(--muted);min-height:17px}
.hint.good{color:var(--ok)}
.inp.huge{font:700 28px/1 var(--display);letter-spacing:.03em;text-transform:uppercase}
.inp.huge::placeholder{text-transform:none;font-weight:600;opacity:.55}
.row{display:flex;gap:8px}
.row .inp{flex:1;min-width:0}

/* Fiche chambre / poteau */
.head{flex:none;display:flex;gap:8px}
.head #pName{flex:0 0 38%;min-width:0;font-size:22px;padding:8px 10px}
.head #pAddr{flex:1;min-width:0;font-size:16px}
.gps-btn small{position:absolute;bottom:2px;left:0;right:0;font:700 11px/1 var(--body);text-align:center;font-variant-numeric:tabular-nums}
.gps-btn.has svg{margin-bottom:8px}
.gps-btn.weak{border-color:var(--warn);color:var(--warn)}
.gps-btn{position:relative;flex:none;width:56px;border-radius:12px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center}
.gps-btn svg{width:26px;height:26px}
.gps-btn.has{border-color:var(--ok);color:var(--ok)}
.gps-btn.busy svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.tiles{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px}
.tiles.chambre .tile:last-child{grid-column:span 2}
.mrow{flex:none;display:flex;flex-direction:column;gap:6px}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mgal{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:0;border-radius:14px;border:2px dashed var(--line);background:transparent;font:600 12px var(--body);color:var(--muted);padding:0}
.mgal svg{width:22px;height:22px}
.minis{display:grid;grid-template-columns:repeat(4,1fr) .8fr;gap:7px;height:clamp(62px,11dvh,104px)}
.mini{position:relative;min-width:0;border-radius:14px;border:2px solid var(--line);background:var(--card);overflow:hidden;padding:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.mini:active{background:var(--bg)}
.mini b{font:700 clamp(28px,9vw,40px)/1 var(--display);position:relative;z-index:2}
.mini small{display:grid;place-items:center;position:relative;z-index:2;color:var(--muted)}
.mini small svg{width:20px;height:20px}
.mini .mck{display:none}
.mini.done{border:3px solid var(--ok)}
.mini.done::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(to top,rgba(0,0,0,.75),rgba(0,0,0,.1) 60%)}

.mini.done small{display:none}
.mini.done .mck{display:grid;place-items:center;position:absolute;top:5px;right:5px;z-index:2;width:24px;height:24px;border-radius:50%;background:var(--ok);color:#fff}
.mini .mck svg{width:15px;height:15px}

  background:var(--danger);transform:rotate(-38deg);pointer-events:none}
.mini.na::before{content:"";position:absolute;z-index:3;left:-10%;right:-10%;top:50%;height:5px;margin-top:-2.5px;border-radius:3px;
  background:var(--danger);transform:rotate(38deg);pointer-events:none}
.tile{container-type:size;position:relative;min-height:0;min-width:0;border-radius:16px;overflow:hidden;background:var(--card);border:2px solid var(--line)}
.tile.opt{border-style:dashed}
.tile.done{border:3px solid var(--ok)}
.shoot{position:absolute;inset:0;border:0;background:transparent;padding:46px 10px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;overflow:hidden}
.shoot>*{max-width:100%;flex:none}
.shoot:active{background:rgba(127,127,127,.15)}
.shoot .ic{width:52px;height:52px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;margin-bottom:4px}
.shoot .ic svg{width:28px;height:28px}
.tile.opt .shoot .ic{background:transparent;color:var(--fg);border:2px solid var(--line)}
.shoot .lb{font:700 clamp(15px,11cqw,21px)/1.08 var(--display);text-wrap:balance;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.shoot .rq{font:600 12px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile .num{position:absolute;top:8px;left:8px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  font:700 16px var(--display);background:var(--bg);color:var(--muted);z-index:2;pointer-events:none}
.tile .num svg{width:17px;height:17px}
.mini .bgimg,.tile .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile.done .shoot{justify-content:flex-end;align-items:stretch;text-align:left;color:#fff;padding-top:10px}
.tile.done .shoot::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.82) 0%,rgba(0,0,0,.25) 45%,transparent 70%)}

.tile.done .shoot::before{z-index:1}

.shoot .multi{display:inline-flex;align-items:center;gap:5px;margin-top:6px;padding:5px 9px;border-radius:99px;background:var(--bg);font:600 13px/1 var(--body);color:var(--fg);white-space:nowrap}
.shoot .multi svg{width:16px;height:16px}

  background:#fff;color:#14161a;font:700 17px/1 var(--display);letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.3)}

  display:flex;align-items:center;justify-content:center;gap:4px;background:var(--bg);color:var(--fg);font:700 18px var(--display)}

/* Tuiles basses (petits écrans) : on garde l'essentiel */
@container (max-height:150px){
  .shoot{padding-top:40px;gap:2px}
  .shoot .ic{width:36px;height:36px;margin-bottom:0}
  .shoot .ic svg{width:20px;height:20px}

}
@container (max-height:110px){ .shoot .ic{display:none} .shoot{padding-top:34px} }
@container (max-width:150px){ .more{min-width:42px;height:42px} .shoot .rq{letter-spacing:.03em} }
.tile.done.busy,.mini.done.busy{background:#3a3f47}
.tile.busy::after,.mini.busy::after{content:"";position:absolute;z-index:4;top:50%;left:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;
  border:3px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .8s linear infinite;pointer-events:none}
.tile.busy::after{top:38%}
.ghost.tog.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.mapwrap{flex:1;min-height:0;position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
#map{position:absolute;inset:0}
.legend{position:absolute;z-index:500;top:10px;left:10px;display:flex;gap:10px;background:var(--card);color:var(--fg);border-radius:10px;padding:7px 10px;font:600 13px var(--body);box-shadow:0 2px 8px rgba(0,0,0,.2)}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.dot.ok{background:#2f7a52}.dot.warn{background:#c0782b}
.mapnote{position:absolute;z-index:500;left:10px;bottom:10px;background:var(--card);color:var(--warn);border-radius:10px;padding:7px 10px;font:600 13px var(--body);box-shadow:0 2px 8px rgba(0,0,0,.2)}
.pathinfo{position:absolute;z-index:500;top:52px;left:10px;max-width:calc(100% - 20px);white-space:nowrap;background:var(--card);color:var(--fg);border-radius:10px;padding:7px 10px;font:700 13px/1.25 var(--body);box-shadow:0 2px 8px rgba(0,0,0,.2)}
.mapnote.off{bottom:auto;top:94px;color:var(--muted)}
.pathinfo.warn{color:var(--warn);font-weight:600}
.mapmsg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);text-align:center;padding:20px}
.mtip .tk{display:block;font-size:12px;font-weight:700;color:#5b6370;text-align:center;border-bottom:1px solid #d3d8de;margin:0 -2px 2px;padding-bottom:2px}
.tdia{width:14px;height:14px;transform:rotate(45deg);background:#5b6370;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.tdia.warn{background:#c0782b}
.mtip{font:700 13px var(--body)!important;padding:2px 6px!important;border-radius:6px!important}
.mpop{display:flex;flex-direction:column;gap:3px;min-width:150px;font-family:var(--body)}
.mpop b{font:700 20px var(--display)}
.mpop span{color:#5b6370;font-size:13px}
.mpop em{color:#8a5a1f;font-size:13px;font-style:normal}
.mpop button{margin-top:6px;min-height:44px;border:0;border-radius:10px;background:#1f2227;color:#fff;font:700 17px var(--display);text-transform:uppercase}
.leaflet-container{font-family:var(--body)}
.flash{animation:flash .5s ease-out}
@keyframes flash{from{box-shadow:inset 0 0 0 999px rgba(127,127,127,.4)}to{box-shadow:inset 0 0 0 999px transparent}}

/* Fenêtres */
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:12px;max-height:90dvh;overflow:auto}
.sheet h2{margin:0;font:700 27px/1.1 var(--display);text-wrap:balance}
.sheet p{margin:0;color:var(--muted)}
.sheet .acts{display:flex;flex-direction:column;gap:10px}
.sheet .acts .primary{flex:none}
.sheet .duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-danger{background:var(--danger);color:#fff}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid3 button{aspect-ratio:1;max-width:100%;border:0;border-radius:10px;padding:0;overflow:hidden;background:var(--bg)}
.grid3 .spin{display:block;width:22px;height:22px;margin:auto;border-radius:50%;border:3px solid var(--line);border-top-color:var(--fg);animation:spin .8s linear infinite}
.grid3 button{display:grid;place-items:center}
.grid3 img{width:100%;height:100%;object-fit:cover;display:block}
.ch-item{display:flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:12px;padding:6px 6px 6px 12px}
.ch-item.cur{border-color:var(--accent)}
.ch-item .go{flex:1;min-width:0;text-align:left;background:none;border:0;padding:4px 0}
.ch-item .go b{display:block;font:700 22px/1.1 var(--display)}
.ch-item .go small{color:var(--muted);font-size:14px}
.viewer{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column}
.viewer img{flex:1;min-height:0;width:100%;object-fit:contain}
.viewer .vb{display:flex;gap:10px;padding:10px max(14px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(14px,env(safe-area-inset-left,0px))}
.viewer .vb button{flex:1;min-height:58px;border-radius:14px;border:0;font:700 20px var(--display);text-transform:uppercase}
.viewer .cap{color:#fff;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 8px;font:600 16px var(--body)}
.progress{height:10px;border-radius:99px;background:var(--bg);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.offline{flex:none;display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:99px;background:#3a3f47;color:#e4e6e9;font:600 13px var(--body);margin-right:4px}
.offline svg{width:16px;height:16px}
.bar.hero .offline{position:absolute;top:calc(env(safe-area-inset-top,0px) + 15px);right:calc(max(10px,env(safe-area-inset-right,0px)) + 48px);width:34px;height:34px;padding:0;justify-content:center;font-size:0;gap:0}
.bar.hero .offline svg{width:18px;height:18px}
.about-btn{display:none;position:absolute;z-index:2;top:calc(env(safe-area-inset-top,0px) + 10px);right:max(10px,env(safe-area-inset-right,0px));
  width:40px;height:40px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;font:700 22px/1 var(--display);padding:0}
.about-btn:active{background:rgba(255,255,255,.2)}
.bar.hero .about-btn{display:grid;place-items:center}
.about{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.about .hd{display:flex;align-items:center;gap:14px}
.about .lg{--markbg:#1f2227;flex:none;width:60px;height:60px;border-radius:22%;background:#1f2227;color:#f4f5f6;display:grid;place-items:center}
.about .lg svg{width:64%;height:64%}
.about .hd b{display:block;font:700 40px/1 var(--display)}
.about .hd small{color:var(--muted);font:600 13px var(--body);letter-spacing:.08em;text-transform:uppercase}
.about .card{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.about .card .k{font:600 12px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.about .card .v{font:700 22px/1.15 var(--display)}
.about .mail{display:flex;align-items:center;gap:8px}
.about .mail a{flex:1;min-width:0;font:600 16px var(--body);color:var(--fg);overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
.about .copy{flex:none;min-height:44px;padding:0 12px;border-radius:10px;border:2px solid var(--line);background:var(--card);font:600 14px var(--body)}
.about .cred{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
.helpbtn{flex:none;display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px;min-height:60px}
.helpbtn .q{flex:none;width:38px;height:38px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font:700 24px var(--display)}
.helpbtn .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.helpbtn b{font:700 21px/1.1 var(--display)}
.helpbtn small{color:var(--muted);font-size:14px}
.helpbtn svg{width:22px;height:22px;color:var(--muted);flex:none}
.aide{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:8px}
.step{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.step .n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font:700 19px var(--display)}
.step .tx{min-width:0}
.step h3{margin:2px 0 4px;font:700 21px/1.15 var(--display)}
.step p{margin:0;color:var(--muted);font-size:15px;line-height:1.4}
.step p b{color:var(--fg)}
.tips{background:transparent;border:2px dashed var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.tips h3{margin:0;font:700 19px var(--display);text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.tips p{margin:0;font-size:15px;line-height:1.4}
.extbar{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.extbar>*{min-width:0;overflow:hidden}
.extbar .ghost{min-height:48px;white-space:nowrap;font:700 16px var(--display);text-transform:uppercase;letter-spacing:.02em;text-decoration:none;color:var(--fg);padding:0 8px}
.extbar .ghost svg{width:20px;height:20px;flex:none}
.camopts{display:flex;flex-direction:column;gap:8px}
.camopt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px}
.camopt.on{border-color:var(--fg)}
.camopt .rd{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);margin-top:2px;position:relative}
.camopt.on .rd{border-color:var(--fg)}.camopt.on .rd::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--fg)}
.camopt .tx{min-width:0;display:flex;flex-direction:column;gap:3px}
.camopt b{font:700 19px/1.15 var(--display)}
.camopt small{color:var(--muted);font-size:14px;line-height:1.35}
.lead{margin:0;color:var(--muted);font-size:16px;max-width:60ch}
.techrow{margin-top:auto;flex:none;display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:1px dashed var(--line);border-radius:14px;padding:10px 12px}
.techrow .av{flex:none;width:40px;height:40px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font:700 17px var(--display);letter-spacing:.04em}
.techrow .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.techrow b{font:600 16px var(--body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.techrow small{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.techrow .ed{flex:none;font:600 14px var(--body);color:var(--muted)}
.toast{pointer-events:none;position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);z-index:70;
  background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;max-width:90vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
"use strict";
/* ---------- Icônes ---------- */
const I={
  chambre:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="1.5"/><path d="M3 10h18M8 6v4M16 6v4"/></svg>',
  poteau:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v18M7 6h10M8 9.5h8M9 21h6"/></svg>',
  cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  gal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 9"/></svg>',
  gps:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
  zip:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  folder:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 6a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></svg>',
  technique:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><circle cx="12" cy="12" r="2.6"/></svg>',
  link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>',
  note:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h10l4 4v12H5z"/><path d="M14 4v5h5M8 13h8M8 17h5"/></svg>',
  map:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg>',
  stack:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="7" y="7" width="13" height="13" rx="2"/><path d="M4 16V5a1 1 0 0 1 1-1h11"/></svg>'
};

/* ---------- Ce qu'il faut photographier ---------- */
const SLOTS={
  chambre:[
    ...["A","B","C","D"].map(l=>({k:"masque_"+l.toLowerCase(),label:"Masque "+l,letter:l,file:"masque_"+l,req:true,mini:true})),
    {k:"dessus",label:"Vue du dessus ouverte",file:"vue_dessus",req:true},
    {k:"implantation",label:"Vue d'implantation",file:"implantation",req:true},
    {k:"boitier",label:"Boîtier",file:"boitier",req:false},
    {k:"autres",label:"Autres photos",file:"autre",req:false,extra:true}
  ],
  poteau:[
    {k:"implantation",label:"Implantation poteau entier",file:"implantation",req:true},
    {k:"tete",label:"Tête du poteau",file:"tete_poteau",req:true},
    {k:"etiquette",label:"Étiquette",file:"etiquette",req:true},
    {k:"boitier",label:"Boîtier",file:"boitier",req:false},
    {k:"autres",label:"Autres photos",file:"autre",req:false,extra:true}
  ]
};
SLOTS.technique=[{k:"photos",label:"Photos",file:"photo",req:true,free:true}];
const TYPE_LABEL={chambre:"Chambre",poteau:"Poteau",technique:"Point technique"};
const isTech=p=>p.type==="technique";
const parentOf=(c,p)=>p&&p.parent?c.points.find(x=>x.id===p.parent):null;
const childrenOf=(c,p)=>c.points.filter(x=>x.parent===p.id);
// Adresse d'un relevé : un point technique reprend celle de sa chambre ou de son poteau
const addrOf=(c,p)=>isTech(p)?((parentOf(c,p)||{}).address||""):(p.address||"");
// Position : un point technique est à la position de son support (chambre ou poteau)
function techPos(c,p){const par=parentOf(c,p);return par&&par.gps?{lat:par.gps.lat,lon:par.gps.lon}:null}
const gpsOf=(c,p)=>isTech(p)?techPos(c,p):(p.gps?{lat:p.gps.lat,lon:p.gps.lon}:null);

/* ---------- Stockage (IndexedDB : rien n'est perdu si le téléphone ferme la page) ---------- */
let db;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open("doe-terrain",1);
  r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore("kv");d.createObjectStore("photos")};
  r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
function tx(store,mode,fn){return new Promise((res,rej)=>{const t=db.transaction(store,mode);const s=t.objectStore(store);let out;
  const r=fn(s);if(r)r.onsuccess=()=>{out=r.result};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
const kvGet=k=>tx("kv","readonly",s=>s.get(k));
const kvSet=(k,v)=>tx("kv","readwrite",s=>s.put(v,k));
const phGet=id=>tx("photos","readonly",s=>s.get(id));
const phSet=(id,v)=>tx("photos","readwrite",s=>s.put(v,id));
const phDel=id=>tx("photos","readwrite",s=>s.delete(id));

let S={current:null,chantiers:{}};
const save=()=>kvSet("state",S).catch(e=>toast("Erreur d'enregistrement : "+e.message));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const cur=()=>S.chantiers[S.current]||null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe=s=>String(s||"").trim().replace(/[\\/:*?"<>|]+/g,"-").replace(/\s+/g,"_").replace(/^\.+/,"")||"sans_nom";

/* ---------- Compression des photos + miniatures ---------- */
const MAX_PX=1920,QUALITY=.8; // 1920 px sur le grand côté, JPEG 80 % : ~300-600 Ko par photo, lisible pour un DOE
async function loadImg(blob){
  try{return await createImageBitmap(blob,{imageOrientation:"from-image"})}catch(e){

function getPos(){return new Promise((res,rej)=>{

/* Position précise du tech : on écoute la puce GPS jusqu'à ±10 m (ou 15 s max) et on garde la meilleure mesure.

      if(!best||c.accuracy<best.accuracy)best={latitude:c.latitude,longitude:c.longitude,accuracy:c.accuracy};
      if(onProgress)onProgress(best.accuracy);
      if(best.accuracy<=target||(Date.now()-t0>6000&&best.accuracy<=20))end()},
    e=>{if(e.code===1){done=true;navigator.geolocation.clearWatch(w);clearTimeout(to);rej(e)}},

  if(v.length>3&&!/^[0-9]*$/.test(v.slice(3)))return"Après les 3 lettres : uniquement des chiffres";

async function routeOSRM(ll){ // ll : [[lat,lon],...] -> {coords,dist,legs}
  const out=[],legs=[],snaps=[];let dist=0;const CH=40;
  for(let i=0;i<ll.length-1;i+=CH-1){const part=ll.slice(i,i+CH);if(part.length<2)break;
    const q=part.map(([la,lo])=>`${lo.toFixed(6)},${la.toFixed(6)}`).join(";");
    const r=await fetchT(`https://router.project-osrm.org/route/v1/driving/${q}?overview=full&geometries=geojson&continue_straight=false`,{},6000);
    if(!r.ok)throw new Error("route");const j=await r.json();if(j.code!=="Ok"||!j.routes||!j.routes[0])throw new Error("route");
    const g=j.routes[0].geometry.coordinates.map(([lo,la])=>[la,lo]);if(out.length)g.shift();out.push(...g);dist+=j.routes[0].distance;
    (j.routes[0].legs||[]).forEach(l=>legs.push(l.distance));
    (j.waypoints||[]).forEach((w,k)=>{if(i&&!k)return;snaps.push([w.location[1],w.location[0]])})}
  return{coords:out,dist,legs:legs.length===ll.length-1?legs:ll.slice(1).map((x,i)=>hav(ll[i],x)),snaps:snaps.length===ll.length?snaps:[]}}

async function exifDate(file){

    let o=2;while(o<b.byteLength-4){const m=b.getUint16(o);if((m&0xFF00)!==0xFF00)return null;const len=b.getUint16(o+2);
      if(m===0xFFE1&&b.getUint32(o+4)===0x45786966){const t=o+10,le=b.getUint16(t)===0x4949,u16=x=>b.getUint16(x,le),u32=x=>b.getUint32(x,le);
        const ifd=(start)=>{const n=u16(start),out={};for(let i=0;i<n;i++){const e=start+2+i*12;out[u16(e)]={type:u16(e+2),cnt:u32(e+4),val:e+8}}return out};
        const str=en=>{if(!en)return null;const off=en.cnt>4?t+u32(en.val):en.val;let s="";for(let i=0;i<en.cnt-1;i++)s+=String.fromCharCode(b.getUint8(off+i));return s};
        const i0=ifd(t+u32(t+4));let d=null;
        if(i0[0x8769]){const ex=ifd(t+u32(i0[0x8769].val));d=str(ex[0x9003])||str(ex[0x9004])}
        d=d||str(i0[0x0132]);
        const m2=d&&/^(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d)/.exec(d);return m2?new Date(+m2[1],m2[2]-1,+m2[3],+m2[4],+m2[5]).getTime():null}
      o+=2+len}}catch(e){}return null}

    const kids=childrenOf(c,p);let ky=y+156;

let pathLine=null;
async function drawPath(c,m){
  const ll=c.points.filter(p=>p.gps&&!isTech(p)).map(p=>[p.gps.lat,p.gps.lon]);
  const info=$("#pathInfo");if(ll.length<2){if(info)info.hidden=true;return}
  const key=ll.map(x=>x[0].toFixed(6)+","+x[1].toFixed(6)).join("|");
  const setInfo=(t,cls)=>{const e=$("#pathInfo");if(e){e.hidden=false;e.textContent=t;e.className="pathinfo "+(cls||"")}};
  const show=(coords,road,snaps)=>{if(pathLine)pathLine.remove();
    const grp=pathLine=L.layerGroup().addTo(m);
    L.polyline(coords,road?{color:"#1f2227",weight:5,opacity:.85,lineJoin:"round"}:{color:"#1f2227",weight:3,opacity:.6,dashArray:"6 8"}).addTo(grp).bringToBack();
    // raccord pointillé entre la route et la position réelle prise par le tech
    if(road&&snaps&&snaps.length===ll.length)snaps.forEach((s,i)=>{if(hav(s,ll[i])>=2)L.polyline([s,ll[i]],{color:"#1f2227",weight:2.5,opacity:.8,dashArray:"4 5"}).addTo(grp)})};
  if(c.route&&c.route.key===key&&c.route.snaps){show(c.route.coords,true,c.route.snaps);setInfo(`Cheminement ≈ ${fmtDist(c.route.dist)}`);return}
  show(ll,false);setInfo("Calcul du cheminement…");
  try{const r=await routeOSRM(ll);if(route.v!=="map"||mapObj!==m)return;
    c.route={key,coords:r.coords.map(([a,b])=>[+a.toFixed(6),+b.toFixed(6)]),dist:r.dist,legs:r.legs,snaps:r.snaps};save();show(c.route.coords,true,c.route.snaps);setInfo(`Cheminement ≈ ${fmtDist(r.dist)}`)}
  catch(e){if(route.v==="map")setInfo(`À vol d'oiseau ≈ ${fmtDist(straightDist(ll))}`,"warn")}}

/* Position automatique à la première photo d'un relevé (sans bloquer) */
const locWait=new Map();
function locateFor(p){ // position précise de l'ouvrage, prise devant lui à la première photo
  if(isTech(p)||(p.gps&&p.gps.acc<=15))return Promise.resolve();
  if(!locWait.has(p.id))locWait.set(p.id,autoLocate(p).finally(()=>locWait.delete(p.id)));
  return Promise.race([locWait.get(p.id),new Promise(r=>setTimeout(r,20000))])}
async function autoLocate(p){if(isTech(p))return;if(p._locating||(p.gps&&p.gps.acc<=15))return;p._locating=true;
  try{const co=await getPrecisePos();
    // à chaque photo, on garde la mesure la plus précise prise devant l'ouvrage
    if(p.gps&&p.gps.acc<=co.accuracy)return;
    p.gps={lat:co.latitude,lon:co.longitude,acc:co.accuracy,at:Date.now()};
    if(route.v==="point"&&route.id===p.id){const b=$("#gpsBtn");if(b)b.classList.add("has");paintGps(p)}
    if(!isTech(p)&&(!p.address||!cur().city)){const g=await reverseGeo(co.latitude,co.longitude).catch(()=>null);
      if(g){if(!p.address){p.address=g.label;p.addrParts=g.parts;const a=$("#pAddr");if(a&&route.id===p.id)a.value=g.label}const c=cur();if(c&&!c.city&&g.city)c.city=g.city}}
  }catch(e){}finally{delete p._locating;save()}}

async function addFiles(files,src){
  if(!pendingSlot||!files.length)return;
  const ext=(S.camMode||"sogeo")==="choose",now=Date.now();
  const c=cur();const p=c&&c.points.find(x=>x.id===pendingSlot.pid);if(!p)return;
  // Galerie des masques : les photos remplissent A, B, C, D dans l'ordre (cases vides d'abord)
  const auto=pendingSlot.k==="__masques",all=pendingSlot.k==="__all";const touched=new Set();let skipped=0;const newJobs=[];
  // import dans l'ordre : les photos remplissent les cases vides dans l'ordre de l'écran, le surplus va dans « Autres »
  const queue=all?importOrder(p).filter(k=>k==="photos"||(!(p.photos[k]||[]).length&&!isNA(p,k))):[];
  for(const f of files){
    let k=pendingSlot.k;
    if(auto){const free=SLOTS[p.type].find(s=>s.mini&&!(p.photos[s.k]||[]).length&&!isNA(p,s.k));if(!free){skipped++;continue}k=free.k}
    if(all){k=queue[0]==="photos"?"photos":(queue.shift()||"autres")}
    const id=uid();
    // Original enregistré immédiatement, compression en arrière-plan
    const shot=src==="cam"&&!ext?now:(await exifDate(f))||f.lastModified||now;
    await phSet(id,{blob:f,thumb:null,type:f.type||"image/jpeg",ts:now,shot,mode:ext?"ext":src==="cam"?"sogeo":"import",pending:true});
    (p.photos[k]=p.photos[k]||[]).push(id);touched.add(k);if(p.na&&p.na[k])p.na[k]=false;
    (S.pending=S.pending||[]).push(id);newJobs.push([id,f,k]);
  }
  await save();if(touched.size)vibrate();
  // le bandeau est incrusté dès maintenant ; on attend la position GPS prise devant l'ouvrage (20 s max)
  const gpsP=touched.size&&!ext?locateFor(p):Promise.resolve();
  if(ext&&touched.size)autoLocate(p);
  newJobs.forEach(async([id,f,k])=>{await gpsP;const rec=await phGet(id);if(!rec)return;
    const list=p.photos[k]||[],n=list.indexOf(id),lab=slotLabelAt(p,k,n,list.length);
    compressQueue.add(id,f,{stamp:ext?null:stampLines(c,p,lab,rec),exif:exifFor(c,p,lab,rec)})});
  if(route.v==="point"&&route.id===p.id){touched.forEach(k=>paintTile(p,k,true));updateBarPoint(p)}
  if(slotSheet&&slotSheet.p===p&&touched.has(slotSheet.k))slotSheet.fill();
  const n=files.length-skipped;
  if(all){const lab=[...touched].map(k=>(SLOTS[p.type].find(s=>s.k===k)||{}).label||k);toast(`${files.length} photo${files.length>1?"s":""} rangée${files.length>1?"s":""} : ${lab.join(", ")}`)}
  else if(auto&&skipped)toast(n?`${n} masque${n>1?"s":""} ajouté${n>1?"s":""}, les 4 masques sont remplis`:"Les 4 masques ont déjà une photo");
  else if(auto)toast(n>1?`Masques ${[...touched].map(k=>k.slice(-1).toUpperCase()).join(", ")} ajoutés`:`Masque ${[...touched][0].slice(-1).toUpperCase()} ajouté`);
  else toast(n>1?`${n} photos ajoutées`:"Photo enregistrée");
}

async function locate(p){
  const btn=$("#gpsBtn"),c=cur();
  btn.classList.add("busy");toast("Recherche de la position…");
  let co;try{co=await getPrecisePos(a=>toast(`Précision GPS : ±${Math.round(a)} m…`))}catch(e){btn.classList.remove("busy");toast(posErr(e));return}
  const {latitude:lat,longitude:lon,accuracy:acc}=co;p.gps={lat,lon,acc,at:Date.now()};save();btn.classList.add("has");paintGps(p);
  if(acc>30)toast(`Position imprécise (±${Math.round(acc)} m) : réessaie à découvert`);
  if(isTech(p)){btn.classList.remove("busy");if(acc<=30)toast(`Position du point technique prise ici (±${Math.round(acc)} m)`);return}
  try{const g=await reverseGeo(lat,lon);
    if(g){p.address=g.label;p.addrParts=g.parts;const a=$("#pAddr");if(a&&route.id===p.id)a.value=g.label;
      let msg=`Position prise ici (±${Math.round(acc)} m) · ${g.label}`;
      if(g.city&&c&&!c.city){c.city=g.city;msg+=` · ville du chantier : ${g.city}`;if(route.id===p.id)updateBarPoint(p)}
      save();toast(msg)}
    else if(acc<=30)toast(`Position prise ici (±${Math.round(acc)} m)`);
  }catch(e){toast("Position enregistrée. L'adresse sera ajoutée au retour du réseau")}
  btn.classList.remove("busy");
}

function offerZip(blob,fname){

  const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",.8)),thumb=await drawTo(cv,480,.7);
  const id=uid();await phSet(id,{blob,thumb,type:"image/jpeg",ts:Date.now()});return id}

  if(!await ask("Charger la démo ?",`Un chantier d'exemple ${DEMO_NAME} à Eysines sera créé avec des photos de démonstration. Il se supprime ensuite par le même appui long.`,"Charger"))return;
  const w=sheet(`<h2>Préparation de la démo…</h2><div class="progress"><i id="dbar"></i></div>`);

    const by=techLabel(S.tech),t0=Date.now()-3*3600e3;
    const c={id:uid(),name:DEMO_NAME,city:"Eysines",created:t0,points:[],demo:true};
    // ordre de passage, positions dans Eysines (adresses retrouvées automatiquement avec du réseau)
    const plan=[
      {type:"chambre",name:"L2T-EYS-01",ll:[44.88375,-0.65040],full:true,na:["masque_d"],extra:0},
      {type:"chambre",name:"L1T-EYS-02",ll:[44.88515,-0.65215],skip:["implantation"],note:"Tampon cassé\nChambre encombrée"},
      {type:"poteau",name:"PT-EYS-03",ll:[44.88610,-0.65410],full:true},
      {type:"poteau",name:"PT-EYS-04",ll:[44.88700,-0.65600],full:true,extra:1,note:"Élagage nécessaire"},
      {type:"chambre",name:"L1T-EYS-05",ll:[44.88790,-0.65780],full:true},
      {type:"chambre",name:"L2T-EYS-06",ll:[44.88660,-0.65980],only:["masque_a","masque_b"]}];
    const total=plan.reduce((n,d)=>n+SLOTS[d.type].filter(s=>!s.extra&&(d.only?d.only.includes(s.k):!(d.na||[]).includes(s.k)&&!(d.skip||[]).includes(s.k))).length+(d.extra||0),0);let done=0;
    for(const [i,d] of plan.entries()){
      const p={id:uid(),type:d.type,name:d.name,autoName:d.name,address:"",gps:{lat:d.ll[0],lon:d.ll[1],acc:4},photos:{},by,at:t0+i*25*60e3,note:d.note||""};
      if(d.na){p.na={};d.na.forEach(k=>p.na[k]=true)}
      for(const s of SLOTS[d.type]){
        if(s.extra)continue;if(d.only&&!d.only.includes(s.k))continue;if((d.na||[]).includes(s.k)||(d.skip||[]).includes(s.k))continue;
        if(!d.only&&!s.req&&!d.full)continue;
        p.photos[s.k]=[await demoPhoto(s.label,`${d.name} · Eysines`,d.type==="chambre"?200:28)];

      for(let e=0;e<(d.extra||0);e++){(p.photos.autres=p.photos.autres||[]).push(await demoPhoto("Autre photo",`${d.name} · détail`,140));done++}
      c.points.push(p)}
    const par=c.points[0],tp={id:uid(),type:"technique",name:"PTECH-EYS-01",autoName:"PTECH-EYS-01",address:"",gps:null,photos:{photos:[]},by,at:t0+10*60e3,note:"Réserve de câble",parent:par.id};
    for(const [t,s] of [["Réserve de câble","love de 15 m"],["Point technique","vue d'ensemble"]])tp.photos.photos.push(await demoPhoto(t,`PTECH-EYS-01 · ${s}`,265));
    c.points.splice(1,0,tp);
    S.chantiers[c.id]=c;S.current=c.id;await save();w.remove();renderHome();toast("Chantier de démo chargé");catchUp()
  }catch(e){w.remove();toast("La démo n'a pas pu être créée : "+e.message)}}

/* ---------- Hors ligne ---------- */
function updateOnline(){$("#offBadge").hidden=navigator.onLine}
// Au retour du réseau : adresses et villes manquantes, cheminement de la carte
let catching=false;
async function catchUp(){if(catching||!navigator.onLine)return;catching=true;let n=0;
  try{for(const c of Object.values(S.chantiers))for(const p of c.points){
      if(isTech(p)||!p.gps||(p.address&&c.city))continue;
      const g=await reverseGeo(p.gps.lat,p.gps.lon).catch(()=>null);if(!g)continue;
      if(!p.address){p.address=g.label;p.addrParts=g.parts;n++;const a=$("#pAddr");if(a&&route.v==="point"&&route.id===p.id)a.value=g.label}
      if(!c.city&&g.city)c.city=g.city}
    if(n){save();if(route.v==="home")renderHome();toast(`${n} adresse${n>1?"s":""} complétée${n>1?"s":""}`)}
    if(route.v==="map"&&mapObj&&cur())drawPath(cur(),mapObj);
  }finally{catching=false}}
addEventListener("online",()=>{updateOnline();toast("Réseau retrouvé");catchUp()});
addEventListener("offline",()=>{updateOnline();toast("Hors ligne : tout continue de fonctionner")});

$("#aboutBtn").onclick=openAbout;

/* ---------- Démarrage ---------- */
(async()=>{
  try{await openDB();const st=await kvGet("state");if(st)S=st}catch(e){view.innerHTML=`<div class="empty">Stockage indisponible : ${esc(e.message)}. Ouvre la page hors navigation privée.</div>`;return}
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  // Ancienne version : une seule case "masques" -> répartie sur A, B, C, D
  for(const c of Object.values(S.chantiers))for(const p of c.points){const old=p.photos&&p.photos.masques;if(!old)continue;
    ["a","b","c","d"].forEach((l,i)=>{const k="masque_"+l;if(i<3){if(old[i])(p.photos[k]=p.photos[k]||[]).push(old[i])}
      else{const r=old.slice(3);if(r.length)(p.photos[k]=p.photos[k]||[]).push(...r)}});delete p.photos.masques;save()}
  for(const c of Object.values(S.chantiers))for(const p of c.points)if(isTech(p)&&p.gps)p.gps=null;
  renderAccueil();
  updateOnline();
  if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))navigator.serviceWorker.register("sw.js").catch(()=>{});
  if(navigator.onLine)setTimeout(catchUp,1500);
  for(const id of (S.pending||[]).slice()){try{const r=await phGet(id);if(r&&r.pending)compressQueue.add(id,r.blob);else S.pending=S.pending.filter(x=>x!==id)}catch(e){}}
})();
